[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weknora-structured-query"
version = "0.1.0"
description = "Reusable spreadsheet ingestion and Text-to-SQL service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "celery[redis]>=5.6,<6",
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "openpyxl>=3.1,<4",
  "orjson>=3.10,<4",
  "pandas>=2.3,<4",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "pydantic-settings>=2.10,<3",
  "pymilvus>=2.6,<3",
  "python-calamine>=0.5,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=28,<31",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<10", "pytest-asyncio>=1.1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/structured_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
