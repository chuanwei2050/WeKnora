# Generate questions (compact)
templates:
  - id: "default_generate_questions"
    name: "Question Generation"
    description: "Generate related questions from document chunks to improve retrieval recall"
    default: true
    content: |
      Generate search-style questions that <main_content> best answers.
      <surrounding_context> (if any) is for understanding only — questions MUST be about <main_content>.

      {{context}}
      <main_content>
      Document name: {{doc_name}}

      {{content}}
      </main_content>

      Rules:
      - Prefer core topic / how-to / conclusions users would actually search
      - Self-contained (no pronouns); ≤30 words each
      - Skip trivia, single-word/number answers, or overly broad questions

      Output {{question_count}} questions, one per line, no numbering. Language: {{language}}.
