# Intent-specific system prompts (compact). id = QueryIntent value.
templates:
  - id: "greeting"
    name: "Greeting Response"
    description: "System prompt for greeting intents"
    i18n:
      zh-CN:
        name: "问候回复"
        description: "针对问候意图的系统提示词"
      en-US:
        name: "Greeting Response"
        description: "System prompt for greeting intents"
      ko-KR:
        name: "인사 응답"
        description: "인사 의도에 대한 시스템 프롬프트"
    content: |
      Friendly assistant. User is greeting/thanks/farewell — reply briefly; optionally mention KB Q&A, docs, images.

      {{partial:language_rule}}

  - id: "chitchat"
    name: "Chitchat Response"
    description: "System prompt for casual conversation"
    i18n:
      zh-CN:
        name: "闲聊回复"
        description: "针对闲聊意图的系统提示词"
      en-US:
        name: "Chitchat Response"
        description: "System prompt for casual conversation"
      ko-KR:
        name: "잡담 응답"
        description: "일상적인 대화를 위한 시스템 프롬프트"
    content: |
      Friendly assistant for casual chat (no retrieval). Be concise and helpful; if KB would help better, suggest a more specific question.

      {{partial:language_rule}}

      Current time: {{current_time}}

  - id: "follow_up"
    name: "Follow-up Response"
    description: "System prompt for follow-up questions referencing conversation history"
    i18n:
      zh-CN:
        name: "追问回复"
        description: "针对上下文追问意图的系统提示词"
      en-US:
        name: "Follow-up Response"
        description: "System prompt for follow-up questions referencing conversation history"
      ko-KR:
        name: "후속 응답"
        description: "대화 기록을 참조하는 후속 질문에 대한 시스템 프롬프트"
    content: |
      Answer follow-ups from conversation history only. You may expand prior retrieved facts already in history; do not invent new facts.

      {{partial:language_rule}}

      Current time: {{current_time}}

  - id: "image_only"
    name: "Image Analysis Response"
    description: "System prompt for pure image understanding"
    i18n:
      zh-CN:
        name: "图片分析回复"
        description: "针对纯图片理解意图的系统提示词"
      en-US:
        name: "Image Analysis Response"
        description: "System prompt for pure image understanding"
      ko-KR:
        name: "이미지 분석 응답"
        description: "순수 이미지 이해 의도를 위한 시스템 프롬프트"
    content: |
      Analyze/describe/translate/extract from attached image(s). Use any provided OCR/description. Markdown OK.

      {{partial:language_rule}}

  - id: "summarize"
    name: "Summarize Response"
    description: "System prompt for conversation summarization"
    i18n:
      zh-CN:
        name: "总结回复"
        description: "针对对话总结意图的系统提示词"
      en-US:
        name: "Summarize Response"
        description: "System prompt for conversation summarization"
      ko-KR:
        name: "요약 응답"
        description: "대화 요약 의도를 위한 시스템 프롬프트"
    content: |
      Summarize the conversation: key points, conclusions, action items. Use Markdown.

      {{partial:language_rule}}

  - id: "web_search"
    name: "Web Search Unavailable Response"
    description: "System prompt when web search intent is detected but web search is not enabled"
    i18n:
      zh-CN:
        name: "网络搜索不可用回复"
        description: "当检测到网络搜索意图但未开启网络搜索时的系统提示词"
      en-US:
        name: "Web Search Unavailable Response"
        description: "System prompt when web search intent is detected but web search is not enabled"
      ko-KR:
        name: "웹 검색 불가 응답"
        description: "웹 검색 의도가 감지되었지만 웹 검색이 활성화되지 않은 경우의 시스템 프롬프트"
    content: |
      Knowledge-base assistant; web search is OFF this session. Say so clearly; help from KB/general knowledge with freshness caveats; suggest enabling web search if needed.

      {{partial:language_rule}}

      Current time: {{current_time}}

  - id: "doc_only"
    name: "Document Analysis Response"
    description: "System prompt for pure document understanding"
    i18n:
      zh-CN:
        name: "文档分析回复"
        description: "针对纯文档/文件理解意图的系统提示词"
      en-US:
        name: "Document Analysis Response"
        description: "System prompt for pure document understanding"
      ko-KR:
        name: "문서 분석 응답"
        description: "순수 문서 이해 의도를 위한 시스템 프롬프트"
    content: |
      Analyze/summarize/translate/extract from attached document(s) only. Markdown OK.

      {{partial:language_rule}}
