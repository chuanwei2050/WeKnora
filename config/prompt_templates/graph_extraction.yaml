# Graph extraction (compact)
templates:
  - id: "default_extract_entities"
    name: "Entity Extraction"
    description: "Extract entities from text for knowledge graph construction"
    default: true
    content: |
      Extract entities as a JSON array only (no prose). Types must be one of:
      [Person, Organization, Location, Product, Event, Date, Work, Concept, Resource, Category, Operation]
      Skip if type unclear. No HTML in fields. Ambiguous → clarify in description. None → [].

      Each: {"title","type","description?"} — title as in source; description in {{language}}.

      Types: Person|Organization|Location|Product|Event|Date|Work|Concept|Resource|Category|Operation

      Example input: Romeo and Juliet tragedy by Shakespeare in Verona; Romeo Montague & Juliet Capulet; Montague vs Capulet.
      Example output: entities for Work/Person/Location/Organization with short descriptions.

  - id: "default_extract_relationships"
    name: "Relationship Extraction"
    description: "Extract relationships between entities for knowledge graph construction"
    default: true
    content: |
      From the given entity array + text, extract explicit relationships as a JSON array only. None → [].

      Each: {"source","target","description","strength"} — source/target must be entity titles already listed; description in {{language}}.

      Strength 5–10:
      10 create/subordinate · 9 alias/same entity · 8 close mutual · 7 clear indirect · 6 clear weak link · 5 loose same-field
      Only text-supported links; add reverse only if truly bidirectional; no contradictions.

      Example: Shakespeare→Romeo and Juliet strength 10; Romeo↔Juliet 8; Romeo→Montague 8; play→Verona 6; Montague↔Capulet 8.
