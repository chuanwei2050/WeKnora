# Fallback templates (compact)
templates:
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
    default: true
    content: |
      Sorry — no KB content matched your question. Try rephrasing, adding specifics, or asking another way.

      {{partial:language_rule}}

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
    content: |
      Sorry — I can't answer accurately (out of scope or missing from KB). Try different keywords, smaller sub-questions, or support.

      {{partial:language_rule}}

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
    content: "Sorry, I'm unable to answer this question at the moment. Please try rephrasing, or contact support."

  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
    mode: "model"
    content: |
      Search found no direct match. KB documents:
      {{kb_documents}}

      - If list non-empty: help via doc titles / where to look
      - If empty: answer from general knowledge; say it's not from KB
      - Suggest official sources for domain/latest info

      {{partial:language_rule}}

      User question: {{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
    mode: "model"
    content: |
      Friendly AI. Search found no direct match. KB documents:
      {{kb_documents}}

      - Non-empty list → guide via docs / KB overview
      - Empty/irrelevant → general knowledge; say not from KB
      - Concise; no realtime/privacy claims you can't verify
      - ALWAYS respond in {{language}}

      Question: {{query}}
