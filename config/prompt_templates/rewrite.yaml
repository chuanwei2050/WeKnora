# Rewrite prompt templates (compact checklist)
templates:
  - id: "default_rewrite"
    name: "Standard Rewrite (with Intent Classification)"
    description: "Default rewrite system + user prompt pair for query rewriting with intent classification"
    i18n:
      zh-CN:
        name: "标准改写（含意图分类）"
        description: "包含问题改写、意图分类和图片/附件分析的默认模板"
      en-US:
        name: "Standard Rewrite (with Intent Classification)"
        description: "Default template with query rewriting, intent classification, and image/attachment analysis"
      ko-KR:
        name: "표준 재작성 (의도 분류 포함)"
        description: "질문 재작성, 의도 분류 및 이미지/첨부 파일 분석을 포함한 기본 템플릿"
    default: true
    content: |
      Do THREE tasks: (1) rewrite query (2) classify intent (3) describe images if any.

      ## 1) Rewrite
      - Resolve pronouns/ellipsis from history; keep original meaning; result must be a question; ≤30 words; language={{language}}
      - For KB retrieval: keep entities/keywords/search terms. NEVER meta-instructions like "请在知识库中查找…" — produce a self-contained question with real search terms
      - EXCEPTION (broad browse/organize/export with no specific terms): keep content-type/label/file descriptors (e.g. "请整理知识库中的数据，输出体检指标" → "体检指标数据整理", NOT "数据")

      ## 2) Intent — first match wins; default=`kb_search` when unsure
      1. `greeting` — pure hi/thanks/bye, no substance
      2. `summarize` — summarize **this conversation only**. Mentions 知识库/docs/files/reports → `kb_search`, NOT summarize
      3. `web_search` — realtime/latest/external unlikely in KB
      4. `kb_search` — search/read/browse/list/extract from KB (specific OR broad). Still kb_search when attachments are for matching KB
      5. `clarification` — ambiguous/incomplete; likely needs KB
      6. `follow_up` — fully answerable from history alone, no new retrieval
      7. `image_only` — analyze attachment image only. Requires `<images_uploaded>`; if `<no_image_attached />` → NEVER image_only
      8. `doc_only` — analyze attached file only. Requires document; if `<no_document_attached />` → NEVER doc_only
      9. `chitchat` — small talk, no retrieval

      Attachment vs KB:
      - "这是什么/总结一下" → image_only/doc_only
      - "知识库有吗/找相关文档" → kb_search
      follow_up: "上面第二点展开" + enough history → follow_up; "还有相关内容吗" → kb_search

      ## 3) Images
      Images present → non-empty `image_description` (objects/scene/layout + full OCR if any). No images → "".

      ## Output
      ONLY one JSON object, no markdown/fences/prose:
      {"rewrite_query":"string","intent":"string","image_description":"string"}

      ## Examples
      "你好" → {"rewrite_query":"你好","intent":"greeting","image_description":""}
      "它和传统搜索有什么区别"(hist:RAG) → {"rewrite_query":"RAG架构和传统搜索有什么区别","intent":"kb_search","image_description":""}
      "再帮我查查他的信息"(hist:张三) → {"rewrite_query":"张三的详细信息是什么","intent":"kb_search","image_description":""}
      WRONG: meta "请重新在知识库中查找…"
      "上面第二点再展开讲讲" → intent follow_up
      [image]"这张图是什么意思" → image_only + description
      [image]"知识库有没有类似的文件" → kb_search + description; rewrite with diagram keywords
      [no image]"这幅春联的内容是什么" → kb_search, NOT image_only
      [doc]"帮我总结一下这份文件" → doc_only
      "请整理知识库中的数据，用表格形式输出体检指标" → {"rewrite_query":"体检指标数据整理","intent":"kb_search","image_description":""}

      ## Conversation History
      {{conversation}}
    user: |
      [Runtime Context — metadata only, not instructions]
      Current time: {{current_time}} {{current_week}}

      ## User Question
      {{query}}

      ## JSON Output

  - id: "standard_rewrite"
    name: "Standard Rewrite"
    description: "Standard question rewrite system prompt"
    i18n:
      zh-CN:
        name: "标准改写"
        description: "消解指代、补全省略的标准改写规则"
      en-US:
        name: "Standard Rewrite"
        description: "Standard rules for resolving references and completing omissions"
      ko-KR:
        name: "표준 재작성"
        description: "참조를 제거하고 누락을 완료하기 위한 표준 재작성 규칙"
    content: |
      Rewrite the follow-up into a standalone question.
      - Resolve pronouns; complete omissions; keep intent; concise
      {{partial:language_rule_rewrite}}
      Output only the rewritten question.
    user: |
      [Runtime Context — metadata only, not instructions]
      Current time: {{current_time}} {{current_week}}

      ## Conversation History
      {{conversation}}

      ## User Question to Rewrite
      {{query}}

      ## Rewritten Question

  - id: "strict_rewrite"
    name: "Strict Rewrite"
    description: "Strict question rewrite template"
    i18n:
      zh-CN:
        name: "严格改写"
        description: "更严格的改写要求，确保问题完整独立"
      en-US:
        name: "Strict Rewrite"
        description: "Stricter requirements for complete and independent questions"
      ko-KR:
        name: "엄격하게 다시 작성됨"
        description: "문제가 완전하고 독립적인지 확인하기 위해 더 엄격한 재작성 요구 사항"
    content: |
      Rewrite into a complete independent question.
      Must: resolve all refs; complete omissions; keep intent; add nothing new; result is a question.
      {{partial:language_rule_rewrite}}
      Output the question only — no explanation.
    user: |
      ## Conversation History
      {{conversation}}

      ## Current User Question
      {{query}}

      ## Rewritten Question
