# Generate document summary (compact)
templates:
  - id: "default_summary"
    name: "Standard Summary"
    description: "Generate a concise document summary"
    default: true
    content: |
      Summarize the document from provided content only (no invention).

      Steps: identify type → extract 3–5 key points → coherent summary.
      Length 100–500 words (simple 100–200; complex 300–500). Cover all sections if "[...content omitted...]" appears.
      Tone: objective third-person. Tech: keep terms/metrics. Meetings: decisions/actions/conclusions.
      Output summary only — no preamble. Never refuse. Language: {{language}}.
