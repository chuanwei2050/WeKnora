# Keywords extraction (compact)
templates:
  - id: "default_keywords_extraction"
    name: "Standard Keywords Extraction"
    description: "Extract important keywords from user's question for retrieval"
    default: true
    content: |
      Extract ≤5 keywords/phrases from the question only (no inventing, no answering).
      Comma-separated; language={{language}}; no explanation.

      Format: keyword1, keyword2, keyword3

      Examples:
      USER: How can I improve my English speaking skills?
      → English speaking, speaking skills, improve English speaking, English fluency, speaking practice
      USER: How to fix iPhone battery draining fast?
      → iPhone, battery drain, battery optimization, battery life, battery health
      USER: What does the Python logo look like?
      → Python logo

      USER: {{query}}
    user: |
      Output:
