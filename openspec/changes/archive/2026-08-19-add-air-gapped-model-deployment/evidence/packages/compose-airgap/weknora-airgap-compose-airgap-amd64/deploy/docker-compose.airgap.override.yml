secrets:
  weknora_runtime:
    file: ${WEKNORA_SECRET_FILE:?set WEKNORA_SECRET_FILE to a local secret file}

services:
  frontend:
    image: wechatopenai/weknora-ui@sha256:b1993a70eec0d1879461a3fbba5d24c021adebdc850807938c20a9760628caa5
    pull_policy: never
  app:
    image: wechatopenai/weknora-app@sha256:7cb9d5f25f626f82ec4b2369295313c5df0108757d28f4f18ada29337060025f
    pull_policy: never
    secrets:
      - weknora_runtime
    environment:
      AIR_GAPPED_MODE: "true"
      WEKNORA_SANDBOX_MODE: "local"
  docreader:
    image: wechatopenai/weknora-docreader@sha256:b9c4636b65b5d4947d5e09cd311ba6cf37f1f2da37c51d4be2b911d432f12abe
    pull_policy: never
  postgres:
    image: paradedb/paradedb@sha256:af585013f97f622715de01e48d00558f7edf17055d7b40deafc9f98ca8d99a56
    pull_policy: never
  redis:
    image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    pull_policy: never
