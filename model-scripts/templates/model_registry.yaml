# WeKnora 模型管理 UI 登记数据结构示例
# VLM 与 Chat 共用主模型端点（无独立 VLM 服务）
# Verifier 与 Evaluation Judge 共用 8003

models:
  - role: embedding
    model_name: qwen3-embedding-4b
    endpoint_url: http://192.168.10.232:8001/v1
    approved_endpoint_id: model-embedding
    protocol: openai-compatible
    engine: vllm
    quant: awq-int4

  - role: rerank
    model_name: bge-reranker-v2-m3
    endpoint_url: http://192.168.10.232:8002/v1
